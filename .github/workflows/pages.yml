name: Build and deploy website

on:
  push:
    branches: [development]
  pull_request:
    branches: [development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install browser for validation
        if: github.event_name == 'pull_request'
        run: npx playwright install --with-deps chromium
      - name: Validate demo in browser
        if: github.event_name == 'pull_request'
        timeout-minutes: 15
        run: |
          npm run preview > /tmp/demo-preview.log 2>&1 &
          demo_preview_pid=$!
          trap 'kill "$demo_preview_pid" || true' EXIT
          for attempt in {1..30}; do
            curl --fail --silent http://localhost:5183/demo-v2/ > /dev/null && break
            sleep 1
          done
          export CHROME_PATH=$(node -p 'require("@playwright/test").chromium.executablePath()')
          npm test
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload website
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/development'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
